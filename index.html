<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1f3a" />
  <title>34 Express Sports Cards | Card Lookup</title>
  <style>
    :root {
      --navy:#0b1f3a;
      --blue:#174a8b;
      --red:#c51f30;
      --ink:#152033;
      --muted:#6b7280;
      --line:#dbe2ea;
      --panel:#ffffff;
      --bg:#f4f7fb;
      --green:#157347;
    }
    * { box-sizing:border-box; }
    html { -webkit-text-size-adjust:100%; }
    body {
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--bg);
      color:var(--ink);
    }
    .topbar {
      background:linear-gradient(135deg,var(--navy),var(--blue));
      color:#fff;
      padding:18px 16px;
      border-bottom:4px solid var(--red);
      box-shadow:0 2px 10px rgba(0,0,0,.16);
    }
    .brand {
      max-width:980px;
      margin:0 auto;
      display:flex;
      align-items:center;
      gap:14px;
    }
    .brand img {
      width:64px;
      height:64px;
      object-fit:contain;
      background:#fff;
      border-radius:10px;
      padding:4px;
    }
    .brand-copy h1 { margin:0; font-size:clamp(22px,4vw,32px); line-height:1.1; }
    .brand-copy p { margin:5px 0 0; opacity:.9; font-size:14px; }
    .wrap { max-width:980px; margin:22px auto 50px; padding:0 14px; }
    .lookup {
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:14px;
      box-shadow:0 8px 24px rgba(16,36,66,.08);
      padding:18px;
    }
    .lookup-row { display:flex; gap:10px; }
    input[type="search"] {
      width:100%;
      border:1px solid #b9c5d3;
      border-radius:9px;
      padding:13px 14px;
      font-size:16px;
      outline:none;
    }
    input[type="search"]:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(23,74,139,.13); }
    button {
      border:0;
      background:var(--blue);
      color:#fff;
      border-radius:9px;
      padding:0 18px;
      font-size:15px;
      font-weight:700;
      cursor:pointer;
      white-space:nowrap;
    }
    button:hover { filter:brightness(.95); }
    .hint { margin:9px 2px 0; color:var(--muted); font-size:13px; }
    .status { margin:16px 2px 0; font-size:14px; color:var(--muted); }
    .result {
      margin-top:18px;
      background:#fff;
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
      box-shadow:0 8px 24px rgba(16,36,66,.08);
      display:none;
    }
    .result-head {
      padding:18px;
      background:#f8fafc;
      border-bottom:1px solid var(--line);
    }
    .result-head .id { color:var(--red); font-size:13px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
    .result-head h2 { margin:6px 0 0; font-size:clamp(20px,4vw,29px); line-height:1.25; }
    .price {
      margin-top:12px;
      display:inline-block;
      background:#eaf6ee;
      color:var(--green);
      border:1px solid #cde8d6;
      border-radius:999px;
      padding:7px 12px;
      font-weight:800;
      font-size:20px;
    }
    .details { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
    .field { padding:15px 18px; border-bottom:1px solid var(--line); }
    .field:nth-child(odd) { border-right:1px solid var(--line); }
    .label { display:block; color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-bottom:5px; }
    .value { display:block; font-size:17px; font-weight:700; overflow-wrap:anywhere; }
    .all-results { margin-top:18px; display:none; }
    .all-results h3 { margin:0 0 10px; font-size:17px; }
    .match {
      display:block;
      width:100%;
      text-align:left;
      background:#fff;
      color:var(--ink);
      border:1px solid var(--line);
      border-radius:10px;
      padding:12px 14px;
      margin:8px 0;
      font-weight:400;
    }
    .match strong { display:block; margin-bottom:3px; }
    .match small { color:var(--muted); }
    .empty { margin-top:18px; padding:20px; text-align:center; background:#fff; border:1px dashed #b9c5d3; border-radius:12px; color:var(--muted); display:none; }
    footer { text-align:center; color:var(--muted); font-size:12px; padding:20px 10px 35px; }
    @media (max-width:620px) {
      .brand img { width:54px; height:54px; }
      .lookup-row { flex-direction:column; }
      button { min-height:46px; }
      .details { grid-template-columns:1fr; }
      .field:nth-child(odd) { border-right:0; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="logo.png" alt="34 Express Sports Cards" onerror="this.style.display='none'" />
      <div class="brand-copy">
        <h1>34 Express Sports Cards</h1>
        <p>Card lookup &amp; show pricing</p>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="lookup" aria-label="Card lookup">
      <div class="lookup-row">
        <input id="search" type="search" inputmode="search" autocomplete="off" placeholder="Scan QR code or enter Card ID, SKU, Cert #, or player/card name" />
        <button id="searchBtn" type="button">Find Card</button>
      </div>
      <div class="hint">Example: CARD-0001, 100138, 153518509, or Aaron Judge</div>
      <div id="status" class="status">112 cards available.</div>
    </section>

    <section id="result" class="result" aria-live="polite">
      <div class="result-head">
        <div id="resultId" class="id"></div>
        <h2 id="resultCard"></h2>
        <div id="resultPrice" class="price"></div>
      </div>
      <div id="details" class="details"></div>
    </section>

    <section id="allResults" class="all-results">
      <h3 id="matchesTitle"></h3>
      <div id="matches"></div>
    </section>

    <div id="empty" class="empty">No matching card was found. Check the Card ID, SKU, Cert #, or card name and try again.</div>
  </main>

  <footer>34 Express Sports Cards &bull; 34esc.com</footer>

    const $ = id => document.getElementById(id);
    const searchInput = $('search');
    const result = $('result');
    const empty = $('empty');
    const allResults = $('allResults');

    function clean(v) { return (v ?? '').toString().trim(); }
    function norm(v) { return clean(v).toLowerCase(); }
    function money(v) {
      if (v === null || v === undefined || v === '') return '';
      const n = Number(v);
      return Number.isFinite(n) ? n.toLocaleString('en-US', {style:'currency', currency:'USD', minimumFractionDigits:2, maximumFractionDigits:2}) : clean(v);
    }
    function esc(s) {
      return clean(s).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }

    function showCard(card) {
      allResults.style.display='none';
      empty.style.display='none';
      result.style.display='block';
      $('resultId').textContent = clean(card['Card ID']);
      $('resultCard').textContent = clean(card['Card']);
      $('resultPrice').textContent = money(card['Price']);

      const fields = [
        ['Grade', card['Grade']],
        ['SKU', card['SKU']],
        ['Cert #', card['Cert #']],
        ['Purchase Date', card['Purchase Date']],
      ];
      $('details').innerHTML = fields.map(([label,value]) => `
        <div class="field"><span class="label">${esc(label)}</span><span class="value">${esc(value || '—')}</span></div>
      `).join('');
      $('status').textContent = `Showing ${clean(card['Card ID'])}.`;
    }

    function searchCards(query, auto=false) {
      const q=norm(query);
      result.style.display='none';
      empty.style.display='none';
      allResults.style.display='none';

      if (!q) { $('status').textContent=`${cards.length} cards available.`; return; }

      // Prefer an exact identifier match so QR-code lookups open directly.
      let exact = cards.find(c =>
        norm(c['Card ID'])===q || norm(c['SKU'])===q || norm(c['Cert #'])===q
      );
      if (exact) { showCard(exact); return; }

      const matches = cards.filter(c => Object.values(c).some(v => norm(v).includes(q)));
      if (matches.length===1) { showCard(matches[0]); return; }
      if (!matches.length) {
        empty.style.display='block';
        $('status').textContent='No matches found.';
        return;
      }

      $('matchesTitle').textContent=`${matches.length} matching cards`;
      $('matches').innerHTML=matches.slice(0,50).map(c => `
        <button type="button" class="match" data-id="${esc(c['Card ID'])}">
          <strong>${esc(c['Card'])}</strong>
          <small>${esc(c['Card ID'])} &bull; ${esc(money(c['Price']))} &bull; Grade ${esc(c['Grade'])}</small>
        </button>
      `).join('');
      allResults.style.display='block';
      $('status').textContent=`${matches.length} matches found.`;
      document.querySelectorAll('.match').forEach(btn => btn.addEventListener('click', () => {
        const c=cards.find(x => clean(x['Card ID'])===btn.dataset.id);
        if (c) { showCard(c); history.replaceState(null,'',`?id=${encodeURIComponent(c['Card ID'])}`); window.scrollTo({top:0,behavior:'smooth'}); }
      }));
    }

    $('searchBtn').addEventListener('click', () => searchCards(searchInput.value));
    searchInput.addEventListener('keydown', e => { if(e.key==='Enter') searchCards(searchInput.value); });

    // Supported QR formats: ?id=CARD-0001, ?card=CARD-0001, ?sku=100138, ?cert=153518509, or #CARD-0001
    const params=new URLSearchParams(window.location.search);
    const incoming=params.get('id') || params.get('card') || params.get('sku') || params.get('cert') || decodeURIComponent(window.location.hash.slice(1));
    if (incoming) { searchInput.value=incoming; searchCards(incoming,true); }
  </script>
