<style>
:root{--navy:#081f46;--navy2:#0d2f68;--red:#cf1f2c;--red2:#a91520;--bg:#f3f6fa;--border:#dfe5ee;--text:#162033;--muted:#6d7789;--green:#15803d;--greenbg:#eaf8ef}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#eef3f9,#f8fafc);color:var(--text)}
header{background:linear-gradient(135deg,var(--navy),var(--navy2));border-bottom:5px solid var(--red);color:white;box-shadow:0 5px 18px rgba(0,0,0,.12)}
.head{max-width:1120px;margin:auto;padding:15px 18px;display:flex;align-items:center;gap:15px}
.logo{width:92px;height:92px;object-fit:contain;background:white;border-radius:15px;padding:4px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
h1{margin:0;font-size:clamp(1.35rem,4vw,2rem)}header p{margin:5px 0 0;color:#dbe6f5}
main{max-width:1120px;margin:25px auto 45px;padding:0 12px}
.panel{background:white;border:1px solid var(--border);border-radius:20px;box-shadow:0 12px 30px rgba(8,31,70,.13);overflow:hidden}
.detail{max-width:820px;margin:auto}.bar{height:7px;background:linear-gradient(90deg,var(--red),#ef3340,var(--red2))}.body{padding:26px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badge{padding:7px 11px;border-radius:999px;font-weight:800;font-size:.86rem}
.id{background:#eef4fb;color:var(--navy2)}.status{background:var(--greenbg);color:var(--green)}
.title{text-align:center;color:var(--navy);font-size:clamp(1.5rem,5vw,2.45rem);line-height:1.2;margin:20px 0}
.pricebox{text-align:center;margin:25px 0}.label{font-size:.72rem;color:var(--muted);font-weight:bold;text-transform:uppercase;letter-spacing:.1em}
.price{font-size:clamp(3rem,11vw,5rem);font-weight:900;color:var(--red);margin:4px 0;letter-spacing:-.03em}
.gradewrap{text-align:center;margin-bottom:22px}.grade{display:inline-block;background:var(--navy);border:4px solid var(--red);color:white;border-radius:14px;padding:9px 20px;font-size:1.8rem;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.box{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:14px}.val{font-weight:800;margin-top:5px;overflow-wrap:anywhere}
.lookup{border-top:1px solid var(--border);margin-top:22px;padding-top:18px;display:flex;gap:8px}
input{flex:1;padding:11px;border:1px solid #bcc8d8;border-radius:9px;font-size:1rem}button{background:var(--red);color:white;border:0;border-radius:9px;padding:0 18px;font-weight:bold;cursor:pointer}
.invhead{background:var(--navy);color:white;padding:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}.invhead h2{margin:0}.invhead input{max-width:380px;background:white}
.wrap{overflow:auto;max-height:72vh}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{position:sticky;top:0;background:#edf3fa;color:var(--navy);white-space:nowrap}.money{font-weight:bold;color:var(--red)}.hidden{display:none!important}
.footer{text-align:center;color:var(--muted);font-size:.85rem;padding:25px 10px}
@media(max-width:700px){.logo{width:72px;height:72px}.body{padding:18px 14px}.grid{grid-template-columns:1fr}.lookup{flex-direction:column}button{min-height:44px}}
</style>
</head>

const headers=["QR_ID", "Card", "Price", "Purchase Date", "Grade", "SKU", "Cert #"];
const ID_KEY="QR_ID";
const CARD_KEY="Card";
const PRICE_KEY="Price";
const GRADE_KEY="Grade";
const DATE_KEY="Purchase Date";
const SKU_KEY="SKU";
const CERT_KEY="Cert #";

const map=new Map(cards.map(c=>[String(c[ID_KEY]??"").trim().toUpperCase(),c]));
const detail=document.getElementById("detailView"), inv=document.getElementById("inventoryView");
const content=document.getElementById("detailContent"), input=document.getElementById("lookupInput");
const tbody=document.getElementById("tbody"), headerRow=document.getElementById("headerRow");

const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
const money=v=>{let n=Number(v);return Number.isFinite(n)?n.toLocaleString("en-US",{style:"currency",currency:"USD"}):esc(v)};
function date(v){if(!v)return"";let p=String(v).split("-");return p.length===3?`${+p[1]}/${+p[2]}/${p[0]}`:v}
function fmt(key,v){if(key===PRICE_KEY)return money(v);if(key===DATE_KEY)return date(v);return v??""}

function show(id){
  inv.classList.add("hidden"); detail.classList.remove("hidden");
  let key=String(id||"").trim().toUpperCase(), c=map.get(key);
  if(!c){content.innerHTML=`<p style="text-align:center;color:#b42318;font-weight:bold">Card ID ${esc(key)} was not found.</p>`;return}

  const standard=new Set([ID_KEY,CARD_KEY,PRICE_KEY,GRADE_KEY,DATE_KEY,SKU_KEY,CERT_KEY]);
  let boxes=[];
  if(DATE_KEY in c) boxes.push([DATE_KEY,fmt(DATE_KEY,c[DATE_KEY])]);
  if(SKU_KEY in c) boxes.push([SKU_KEY,c[SKU_KEY]]);
  if(CERT_KEY in c) boxes.push([CERT_KEY,c[CERT_KEY]]);
  headers.forEach(h=>{if(h && !standard.has(h) && c[h]!=="" && c[h]!=null) boxes.push([h,fmt(h,c[h])])});

  content.innerHTML=`
    <div class="top"><span class="badge id">${esc(c[ID_KEY])}</span><span class="badge status">● Available</span></div>
    <h2 class="title">${esc(c[CARD_KEY])}</h2>
    <div class="pricebox"><div class="label">Current Price</div><div class="price">${money(c[PRICE_KEY])}</div></div>
    <div class="gradewrap"><div class="grade">${esc(c[GRADE_KEY])}</div><div class="label" style="margin-top:5px">Grade</div></div>
    <div class="grid">${boxes.map(b=>`<div class="box"><div class="label">${esc(b[0])}</div><div class="val">${esc(b[1])}</div></div>`).join("")}</div>`;
  input.value=key;
}

function build(list=cards){
  headerRow.innerHTML=headers.filter(Boolean).map(h=>`<th>${esc(h)}</th>`).join("");
  tbody.innerHTML=list.map(c=>`<tr>${headers.filter(Boolean).map(h=>`<td class="${h===PRICE_KEY?'money':''}">${esc(fmt(h,c[h]))}</td>`).join("")}</tr>`).join("");
}

document.getElementById("lookupForm").onsubmit=e=>{
  e.preventDefault(); let id=input.value.trim(); if(!id)return;
  history.pushState({}, "", `${location.pathname}?id=${encodeURIComponent(id)}`); show(id);
};
document.getElementById("search").oninput=e=>{
  let q=e.target.value.toLowerCase();
  build(cards.filter(c=>Object.values(c).some(v=>String(v??"").toLowerCase().includes(q))));
};
window.onpopstate=()=>{let id=new URLSearchParams(location.search).get("id");if(id)show(id);else{detail.classList.add("hidden");inv.classList.remove("hidden");build()}};
let id=new URLSearchParams(location.search).get("id");if(id)show(id);else{inv.classList.remove("hidden");build()}
</script>
