:root{--navy:#081f46;--red:#cf1f2c;--bg:#f3f6fa;--border:#dfe5ee;--text:#162033;--muted:#6d7789;--green:#15803d}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,#081f46,#0d2f68);border-bottom:5px solid var(--red);color:white}
.head{max-width:1120px;margin:auto;padding:15px 18px;display:flex;align-items:center;gap:15px}
.logo{width:90px;height:90px;object-fit:contain;background:white;border-radius:15px;padding:4px}h1{margin:0;font-size:clamp(1.35rem,4vw,2rem)}header p{margin:5px 0 0;color:#dbe6f5}
main{max-width:1120px;margin:25px auto;padding:0 12px}.panel{background:white;border:1px solid var(--border);border-radius:20px;box-shadow:0 12px 30px rgba(8,31,70,.13);overflow:hidden}
.detail{max-width:820px;margin:auto}.bar{height:7px;background:var(--red)}.body{padding:26px}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badge{padding:7px 11px;border-radius:999px;font-weight:800;font-size:.86rem}
.id{background:#eef4fb;color:#0d2f68}.status{background:#eaf8ef;color:var(--green)}.title{text-align:center;color:var(--navy);font-size:clamp(1.5rem,5vw,2.45rem);line-height:1.2}
.pricebox{text-align:center;margin:25px 0}.label{font-size:.72rem;color:var(--muted);font-weight:bold;text-transform:uppercase;letter-spacing:.1em}
.price{font-size:clamp(3rem,11vw,5rem);font-weight:900;color:var(--red);margin:4px 0}
.gradewrap{text-align:center;margin-bottom:20px}.grade{display:inline-block;background:var(--navy);border:4px solid var(--red);color:white;border-radius:14px;padding:9px 20px;font-size:1.8rem;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.box{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:14px}.val{font-weight:800;margin-top:5px;overflow-wrap:anywhere}
.lookup{border-top:1px solid var(--border);margin-top:22px;padding-top:18px;display:flex;gap:8px}input{flex:1;padding:11px;border:1px solid #bcc8d8;border-radius:9px;font-size:1rem}button{background:var(--red);color:white;border:0;border-radius:9px;padding:0 18px;font-weight:bold}
.invhead{background:var(--navy);color:white;padding:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.invhead h2{margin:0}.invhead input{max-width:380px}
.wrap{overflow:auto;max-height:72vh}table{width:100%;border-collapse:collapse;font-size:.9rem}th,td{padding:10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}th{position:sticky;top:0;background:#edf3fa;color:var(--navy);white-space:nowrap}.money{font-weight:bold;color:var(--red)}.hidden{display:none!important}
@media(max-width:700px){.logo{width:72px;height:72px}.body{padding:18px 14px}.grid{grid-template-columns:1fr}.lookup{flex-direction:column}button{min-height:44px}}
</style></head>

const map=new Map(cards.map(c=>[c["QR_ID"].toUpperCase(),c]));
const detail=document.getElementById("detailView"), inv=document.getElementById("inventoryView"), content=document.getElementById("detailContent"), input=document.getElementById("lookupInput"), tbody=document.getElementById("tbody");
const esc=v=>String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
const money=v=>Number(v).toLocaleString("en-US",{style:"currency",currency:"USD"});
function date(v){if(!v)return"";let p=String(v).split("-");return p.length===3?`${+p[1]}/${+p[2]}/${p[0]}`:v}
function show(id){inv.classList.add("hidden");detail.classList.remove("hidden");let key=String(id||"").trim().toUpperCase(),c=map.get(key);if(!c){content.innerHTML=`<p>Card ID ${esc(key)} was not found.</p>`;return}content.innerHTML=`<div class="top"><span class="badge id">${esc(c["QR_ID"])}</span><span class="badge status">● Available</span></div><h2 class="title">${esc(c.Card)}</h2><div class="pricebox"><div class="label">Current Price</div><div class="price">${money(c.Price)}</div></div><div class="gradewrap"><div class="grade">${esc(c.Grade)}</div><div class="label" style="margin-top:5px">Grade</div></div><div class="grid"><div class="box"><div class="label">Purchase Date</div><div class="val">${esc(date(c["Purchase Date"]))}</div></div><div class="box"><div class="label">SKU</div><div class="val">${esc(c.SKU)}</div></div><div class="box"><div class="label">Cert #</div><div class="val">${esc(c["Cert #"])}</div></div></div>`;input.value=key}
function build(list=cards){tbody.innerHTML=list.map(c=>`<tr><td>${esc(c["QR_ID"])}</td><td>${esc(c.Card)}</td><td class="money">${money(c.Price)}</td><td>${esc(date(c["Purchase Date"]))}</td><td>${esc(c.Grade)}</td><td>${esc(c.SKU)}</td><td>${esc(c["Cert #"])}</td></tr>`).join("")}
document.getElementById("lookupForm").onsubmit=e=>{e.preventDefault();let id=input.value.trim();history.pushState({},"",`${location.pathname}?id=${encodeURIComponent(id)}`);show(id)};
document.getElementById("search").oninput=e=>{let q=e.target.value.toLowerCase();build(cards.filter(c=>Object.values(c).some(v=>String(v).toLowerCase().includes(q))))};
window.onpopstate=()=>{let id=new URLSearchParams(location.search).get("id");if(id)show(id);else{detail.classList.add("hidden");inv.classList.remove("hidden");build()}};
let id=new URLSearchParams(location.search).get("id");if(id)show(id);else{inv.classList.remove("hidden");build()}
