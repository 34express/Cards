<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#081f46">
  <meta name="description" content="34 Express Sports Cards card lookup">
  <title>34 Express Sports Cards</title>

  <style>
    :root {
      --navy:#081f46;
      --navy2:#0d2f68;
      --red:#cf1f2c;
      --red2:#a91520;
      --white:#ffffff;
      --bg:#f3f6fa;
      --text:#162033;
      --muted:#6d7789;
      --border:#dfe5ee;
      --green:#15803d;
      --green-bg:#eaf8ef;
      --shadow:0 14px 35px rgba(8,31,70,.14);
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(207,31,44,.08), transparent 28%),
        linear-gradient(180deg, #eef3f9 0%, #f8fafc 100%);
      color:var(--text);
    }

    .site-header {
      background:linear-gradient(135deg, var(--navy), var(--navy2));
      color:#fff;
      border-bottom:5px solid var(--red);
      box-shadow:0 5px 18px rgba(0,0,0,.12);
    }

    .header-inner {
      width:min(1120px, calc(100% - 24px));
      margin:auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      padding:16px 0;
    }

    .brand {
      display:flex;
      align-items:center;
      gap:16px;
      min-width:0;
    }

    .logo {
      width:108px;
      height:108px;
      object-fit:contain;
      background:#fff;
      border-radius:18px;
      padding:5px;
      box-shadow:0 5px 14px rgba(0,0,0,.18);
      flex:0 0 auto;
    }

    .brand-text h1 {
      margin:0;
      font-size:clamp(1.25rem, 3.5vw, 2rem);
      letter-spacing:.01em;
    }

    .brand-text p {
      margin:6px 0 0;
      color:#dbe6f5;
      font-size:.95rem;
    }

    .header-chip {
      border:1px solid rgba(255,255,255,.25);
      background:rgba(255,255,255,.09);
      padding:9px 13px;
      border-radius:999px;
      font-weight:700;
      white-space:nowrap;
    }

    main {
      width:min(1120px, calc(100% - 24px));
      margin:28px auto 48px;
    }

    .hero-card {
      background:#fff;
      border:1px solid var(--border);
      border-radius:22px;
      box-shadow:var(--shadow);
      overflow:hidden;
      max-width:820px;
      margin:0 auto;
    }

    .accent-bar {
      height:7px;
      background:linear-gradient(90deg, var(--red), #ef3340, var(--red2));
    }

    .card-body {
      padding:28px;
    }

    .top-row {
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:18px;
    }

    .id-badge {
      background:#eef4fb;
      border:1px solid #d8e4f3;
      color:var(--navy2);
      font-weight:800;
      padding:7px 11px;
      border-radius:999px;
      letter-spacing:.03em;
      font-size:.88rem;
    }

    .status-badge {
      background:var(--green-bg);
      color:var(--green);
      border:1px solid #cbead6;
      font-weight:800;
      padding:7px 11px;
      border-radius:999px;
      font-size:.88rem;
    }

    .card-title {
      margin:0;
      font-size:clamp(1.55rem, 4vw, 2.55rem);
      line-height:1.2;
      color:var(--navy);
      text-align:center;
    }

    .price-wrap {
      text-align:center;
      padding:28px 12px 22px;
    }

    .price-label {
      color:var(--muted);
      font-size:.78rem;
      font-weight:800;
      letter-spacing:.14em;
      text-transform:uppercase;
      margin-bottom:6px;
    }

    .price {
      margin:0;
      font-size:clamp(3rem, 10vw, 5.3rem);
      line-height:1;
      font-weight:900;
      color:var(--red);
      letter-spacing:-.04em;
    }

    .grade-feature {
      display:flex;
      justify-content:center;
      margin-bottom:24px;
    }

    .grade-badge {
      min-width:118px;
      text-align:center;
      background:var(--navy);
      color:#fff;
      border:4px solid var(--red);
      border-radius:16px;
      padding:12px 18px;
      box-shadow:0 7px 16px rgba(8,31,70,.18);
    }

    .grade-badge span {
      display:block;
      text-transform:uppercase;
      letter-spacing:.12em;
      font-size:.68rem;
      opacity:.8;
      margin-bottom:2px;
    }

    .grade-badge strong {
      font-size:2rem;
      line-height:1;
    }

    .details-grid {
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:12px;
      margin-top:4px;
    }

    .detail {
      background:#f8fafc;
      border:1px solid var(--border);
      border-radius:14px;
      padding:15px;
    }

    .detail-label {
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-size:.7rem;
      font-weight:800;
      margin-bottom:6px;
    }

    .detail-value {
      color:var(--text);
      font-weight:800;
      font-size:1rem;
      overflow-wrap:anywhere;
    }

    .lookup-area {
      border-top:1px solid var(--border);
      margin-top:24px;
      padding-top:20px;
    }

    .lookup-area p {
      text-align:center;
      color:var(--muted);
      margin:0 0 12px;
      font-size:.9rem;
    }

    .lookup-form {
      display:flex;
      gap:10px;
      max-width:560px;
      margin:0 auto;
    }

    .lookup-form input {
      flex:1;
      min-height:46px;
      border:1px solid #bcc8d8;
      border-radius:10px;
      padding:10px 12px;
      font-size:1rem;
      outline:none;
    }

    .lookup-form input:focus {
      border-color:var(--navy2);
      box-shadow:0 0 0 3px rgba(13,47,104,.10);
    }

    .lookup-form button {
      min-height:46px;
      border:0;
      border-radius:10px;
      background:var(--red);
      color:#fff;
      font-weight:800;
      padding:0 20px;
      cursor:pointer;
    }

    .lookup-form button:hover {
      background:var(--red2);
    }

    .inventory-panel {
      background:#fff;
      border:1px solid var(--border);
      border-radius:20px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .inventory-head {
      background:linear-gradient(135deg, var(--navy), var(--navy2));
      color:#fff;
      padding:18px 20px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .inventory-head h2 {
      margin:0;
      font-size:1.3rem;
    }

    .inventory-head input {
      width:min(100%,380px);
      min-height:42px;
      border:0;
      border-radius:9px;
      padding:9px 12px;
      font-size:.95rem;
    }

    .table-wrap {
      overflow:auto;
      max-height:72vh;
    }

    table {
      width:100%;
      border-collapse:collapse;
      font-size:.92rem;
    }

    th, td {
      padding:11px 10px;
      border-bottom:1px solid var(--border);
      text-align:left;
      vertical-align:top;
    }

    th {
      position:sticky;
      top:0;
      background:#edf3fa;
      color:var(--navy);
      z-index:2;
      white-space:nowrap;
    }

    td.price-cell {
      color:var(--red);
      font-weight:800;
      white-space:nowrap;
    }

    td.grade-cell {
      font-weight:800;
      text-align:center;
    }

    .hidden {
      display:none !important;
    }

    .error {
      text-align:center;
      color:#b42318;
      font-weight:800;
      padding:16px;
    }

    .footer {
      text-align:center;
      color:var(--muted);
      font-size:.85rem;
      padding:26px 12px 10px;
    }

    @media (max-width:700px) {
      .header-inner {
        align-items:flex-start;
      }

      .logo {
        width:82px;
        height:82px;
      }

      .header-chip {
        display:none;
      }

      main {
        margin-top:16px;
      }

      .card-body {
        padding:20px 16px;
      }

      .details-grid {
        grid-template-columns:1fr;
      }

      .lookup-form {
        flex-direction:column;
      }

      .lookup-form button {
        width:100%;
      }

      .inventory-head {
        align-items:stretch;
      }

      .inventory-head input {
        width:100%;
      }
    }

    @media print {
      .site-header,
      .lookup-area,
      .inventory-head input,
      .footer {
        display:none !important;
      }

      body {
        background:#fff;
      }

      main {
        width:100%;
        margin:0;
      }

      .hero-card,
      .inventory-panel {
        box-shadow:none;
      }

      tr {
        break-inside:avoid;
        page-break-inside:avoid;
      }

      thead {
        display:table-header-group;
      }
    }
  </style>
</head>

    const detailView = document.getElementById("detailView");
    const inventoryView = document.getElementById("inventoryView");
    const detailContent = document.getElementById("detailContent");
    const inventoryBody = document.getElementById("inventoryBody");
    const inventorySearch = document.getElementById("inventorySearch");
    const lookupForm = document.getElementById("lookupForm");
    const lookupInput = document.getElementById("lookupInput");

    const cardMap = new Map(
      cards.map(card => [String(card["QR_ID"]).trim().toUpperCase(), card])
    );

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function money(value) {
      const n = Number(value);
      return Number.isFinite(n)
        ? n.toLocaleString("en-US", {style:"currency", currency:"USD"})
        : esc(value);
    }

    function formatDate(value) {
      if (!value) return "";
      const p = String(value).split("-");
      return p.length === 3 ? `${Number(p[1])}/${Number(p[2])}/${p[0]}` : value;
    }

    function normalizeId(value) {
      return String(value || "").trim().toUpperCase();
    }

    function showCard(id) {
      inventoryView.classList.add("hidden");
      detailView.classList.remove("hidden");

      const normalized = normalizeId(id);
      const card = cardMap.get(normalized);

      if (!card) {
        detailContent.innerHTML =
          `<div class="error">Card ID ${esc(normalized)} was not found.</div>`;
        lookupInput.value = normalized;
        return;
      }

      document.title = `${card["Card"]} | 34 Express Sports Cards`;

      detailContent.innerHTML = `
        <div class="top-row">
          <div class="id-badge">${esc(card["QR_ID"])}</div>
          <div class="status-badge">● ${esc(card["Status"])}</div>
        </div>

        <h2 class="card-title">${esc(card["Card"])}</h2>

        <div class="price-wrap">
          <div class="price-label">Current Price</div>
          <p class="price">${money(card["Price"])}</p>
        </div>

        <div class="grade-feature">
          <div class="grade-badge">
            <span>Grade</span>
            <strong>${esc(card["Grade"])}</strong>
          </div>
        </div>

        <div class="details-grid">
          <div class="detail">
            <div class="detail-label">Purchase Date</div>
            <div class="detail-value">${esc(formatDate(card["Purchase Date"]))}</div>
          </div>

          <div class="detail">
            <div class="detail-label">SKU</div>
            <div class="detail-value">${esc(card["SKU"])}</div>
          </div>
        </div>
      `;

      lookupInput.value = normalized;
    }

    function buildInventory(list = cards) {
      inventoryBody.innerHTML = list.map(card => `
        <tr>
          <td>${esc(card["QR_ID"])}</td>
          <td>${esc(card["Card"])}</td>
          <td class="price-cell">${money(card["Price"])}</td>
          <td>${esc(formatDate(card["Purchase Date"]))}</td>
          <td>${esc(card["SKU"])}</td>
          <td class="grade-cell">${esc(card["Grade"])}</td>
        </tr>
      `).join("");
    }

    function showInventory() {
      detailView.classList.add("hidden");
      inventoryView.classList.remove("hidden");
      buildInventory();
    }

    lookupForm.addEventListener("submit", e => {
      e.preventDefault();
      const id = normalizeId(lookupInput.value);
      if (!id) return;

      history.pushState(
        {},
        "",
        `${location.pathname}?id=${encodeURIComponent(id)}`
      );

      showCard(id);
    });

    inventorySearch.addEventListener("input", () => {
      const term = inventorySearch.value.trim().toLowerCase();
      const filtered = cards.filter(card =>
        Object.values(card).some(v =>
          String(v ?? "").toLowerCase().includes(term)
        )
      );
      buildInventory(filtered);
    });

    window.addEventListener("popstate", () => {
      const id = new URLSearchParams(location.search).get("id");
      id ? showCard(id) : showInventory();
    });

    const requestedId = new URLSearchParams(location.search).get("id");
    requestedId ? showCard(requestedId) : showInventory();
  </script>
