<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="34 Express Sports Cards card lookup">
  <title>34 Express Sports Cards | Card Lookup</title>
  <style>
    :root {
      --navy:#0b1f3a;
      --blue:#1f5fa9;
      --light:#f4f7fb;
      --border:#d9e1ea;
      --text:#17202a;
      --muted:#667085;
      --green:#167447;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:var(--light);
      color:var(--text);
    }

    header {
      background:var(--navy);
      color:#fff;
      text-align:center;
      padding:20px 16px;
    }

    header h1 {
      margin:0;
      font-size:clamp(1.5rem, 5vw, 2.3rem);
    }

    header p {
      margin:8px 0 0;
      opacity:.9;
    }

    main {
      width:min(1150px, calc(100% - 24px));
      margin:24px auto;
    }

    .panel {
      background:#fff;
      border:1px solid var(--border);
      border-radius:14px;
      box-shadow:0 6px 18px rgba(11,31,58,.08);
      padding:22px;
    }

    .hidden { display:none !important; }

    .card-detail {
      max-width:760px;
      margin:0 auto;
    }

    .card-heading {
      text-align:center;
    }

    .card-id {
      display:inline-block;
      background:#e8f0fb;
      color:var(--blue);
      font-weight:700;
      padding:7px 12px;
      border-radius:999px;
      margin-bottom:18px;
    }

    .card-description {
      font-size:clamp(1.4rem, 5vw, 2.25rem);
      line-height:1.25;
      margin:8px 0 24px;
    }

    .price-label {
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.08em;
      font-size:.9rem;
      text-align:center;
    }

    .price {
      color:var(--green);
      font-size:clamp(2.4rem, 10vw, 4.2rem);
      font-weight:800;
      margin:5px 0 24px;
      text-align:center;
    }

    .details-grid {
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:12px;
      margin-top:18px;
    }

    .detail-box {
      border:1px solid var(--border);
      border-radius:10px;
      padding:14px;
      background:#fafcff;
    }

    .detail-label {
      color:var(--muted);
      font-size:.8rem;
      text-transform:uppercase;
      letter-spacing:.06em;
      margin-bottom:5px;
    }

    .detail-value {
      font-size:1.05rem;
      font-weight:700;
      overflow-wrap:anywhere;
    }

    .lookup-form {
      display:flex;
      gap:10px;
      max-width:560px;
      margin:28px auto 0;
    }

    input, button {
      min-height:44px;
      border-radius:8px;
      font-size:1rem;
    }

    input {
      flex:1;
      padding:10px 12px;
      border:1px solid #b8c4d1;
    }

    button {
      border:0;
      padding:10px 18px;
      background:var(--blue);
      color:#fff;
      font-weight:700;
      cursor:pointer;
    }

    .error {
      color:#b42318;
      font-weight:700;
      text-align:center;
    }

    .inventory-header {
      display:flex;
      gap:14px;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      margin-bottom:16px;
    }

    .inventory-header h2 { margin:0; }

    .inventory-search {
      width:min(100%, 400px);
    }

    .table-wrap {
      overflow-x:auto;
    }

    table {
      width:100%;
      border-collapse:collapse;
      font-size:.95rem;
    }

    th, td {
      padding:10px 9px;
      border-bottom:1px solid var(--border);
      text-align:left;
      vertical-align:top;
    }

    th {
      background:#edf3fa;
      color:var(--navy);
      position:sticky;
      top:0;
      white-space:nowrap;
    }

    td.price-cell {
      white-space:nowrap;
      font-weight:700;
    }

    td.grade-cell {
      text-align:center;
      font-weight:700;
    }

    a { color:var(--blue); }

    @media (max-width:700px) {
      main {
        width:min(100% - 16px, 1150px);
        margin:12px auto;
      }

      .panel {
        padding:18px 14px;
      }

      .details-grid {
        grid-template-columns:1fr;
      }

      .lookup-form {
        flex-direction:column;
      }

      button {
        width:100%;
      }
    }

    @media print {
      header,
      .lookup-form,
      .inventory-search {
        display:none !important;
      }

      body {
        background:#fff;
      }

      main {
        width:100%;
        margin:0;
      }

      .panel {
        box-shadow:none;
        border:0;
        padding:0;
      }

      tr {
        break-inside:avoid;
        page-break-inside:avoid;
      }

      thead {
        display:table-header-group;
      }
    }
  </style>
</head>

    const detailView = document.getElementById("detailView");
    const inventoryView = document.getElementById("inventoryView");
    const detailContent = document.getElementById("detailContent");
    const inventoryBody = document.getElementById("inventoryBody");
    const inventorySearch = document.getElementById("inventorySearch");
    const lookupForm = document.getElementById("lookupForm");
    const lookupInput = document.getElementById("lookupInput");

    const cardMap = new Map(
      cards.map(card => [String(card["QR_ID"]).trim().toUpperCase(), card])
    );

    function esc(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function money(value) {
      const n = Number(value);
      return Number.isFinite(n)
        ? n.toLocaleString("en-US", { style:"currency", currency:"USD" })
        : esc(value);
    }

    function formatDate(value) {
      if (!value) return "";
      const parts = String(value).split("-");
      if (parts.length === 3) {
        return `${Number(parts[1])}/${Number(parts[2])}/${parts[0]}`;
      }
      return value;
    }

    function normalizeId(value) {
      return String(value || "").trim().toUpperCase();
    }

    function showCard(id) {
      detailView.classList.remove("hidden");
      inventoryView.classList.add("hidden");

      const normalized = normalizeId(id);
      const card = cardMap.get(normalized);

      if (!card) {
        detailContent.innerHTML =
          `<p class="error">Card ID ${esc(normalized)} was not found.</p>`;
        lookupInput.value = normalized;
        return;
      }

      document.title = `${card["Card"]} | 34 Express Sports Cards`;

      detailContent.innerHTML = `
        <div class="card-heading">
          <div class="card-id">${esc(card["QR_ID"])}</div>
          <h2 class="card-description">${esc(card["Card"])}</h2>
          <div class="price-label">Current Price</div>
          <div class="price">${money(card["Price"])}</div>
        </div>

        <div class="details-grid">
          <div class="detail-box">
            <div class="detail-label">Purchase Date</div>
            <div class="detail-value">${esc(formatDate(card["Purchase Date"]))}</div>
          </div>

          <div class="detail-box">
            <div class="detail-label">SKU</div>
            <div class="detail-value">${esc(card["SKU"])}</div>
          </div>

          <div class="detail-box">
            <div class="detail-label">Grade</div>
            <div class="detail-value">${esc(card["Grade"])}</div>
          </div>
        </div>
      `;

      lookupInput.value = normalized;
    }

    function buildInventory(list = cards) {
      inventoryBody.innerHTML = list.map(card => {
        const url =
          `${window.location.origin}${window.location.pathname}?id=${encodeURIComponent(card["QR_ID"])}`;

        return `
          <tr>
            <td>${esc(card["QR_ID"])}</td>
            <td>${esc(card["Card"])}</td>
            <td class="price-cell">${money(card["Price"])}</td>
            <td>${esc(formatDate(card["Purchase Date"]))}</td>
            <td>${esc(card["SKU"])}</td>
            <td class="grade-cell">${esc(card["Grade"])}</td>
            <td><a href="${url}">View</a></td>
          </tr>
        `;
      }).join("");
    }

    function showInventory() {
      detailView.classList.add("hidden");
      inventoryView.classList.remove("hidden");
      buildInventory();
    }

    lookupForm.addEventListener("submit", e => {
      e.preventDefault();
      const id = normalizeId(lookupInput.value);
      if (!id) return;

      history.pushState(
        {},
        "",
        `${location.pathname}?id=${encodeURIComponent(id)}`
      );

      showCard(id);
    });

    inventorySearch.addEventListener("input", () => {
      const term = inventorySearch.value.trim().toLowerCase();

      const filtered = cards.filter(card =>
        Object.values(card).some(value =>
          String(value ?? "").toLowerCase().includes(term)
        )
      );

      buildInventory(filtered);
    });

    window.addEventListener("popstate", () => {
      const id = new URLSearchParams(location.search).get("id");
      id ? showCard(id) : showInventory();
    });

    const requestedId = new URLSearchParams(location.search).get("id");
    requestedId ? showCard(requestedId) : showInventory();
  </script>
