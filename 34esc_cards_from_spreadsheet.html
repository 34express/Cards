<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="34 Express Sports Cards inventory lookup">
  <title>34 Express Sports Cards | Card Lookup</title>

  <style>
    :root {
      --navy: #0b1f3a;
      --blue: #1f5fa9;
      --light: #f4f7fb;
      --border: #d9e1ea;
      --text: #17202a;
      --success: #167447;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--light);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      background: var(--navy);
      color: white;
      padding: 18px 24px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: clamp(1.4rem, 4vw, 2.2rem);
    }

    header p {
      margin: 8px 0 0;
      opacity: 0.9;
    }

    main {
      width: min(1100px, calc(100% - 24px));
      margin: 24px auto;
    }

    .panel {
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(11, 31, 58, 0.08);
      padding: 22px;
    }

    .hidden { display: none !important; }

    .card-detail {
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
    }

    .card-id {
      display: inline-block;
      margin-bottom: 18px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #e8f0fb;
      color: var(--blue);
      font-weight: bold;
      letter-spacing: 0.04em;
    }

    .card-description {
      margin: 10px 0 24px;
      font-size: clamp(1.35rem, 5vw, 2.25rem);
      line-height: 1.25;
    }

    .price-label {
      margin-bottom: 6px;
      color: #52606d;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .price {
      margin: 0;
      color: var(--success);
      font-size: clamp(2.3rem, 10vw, 4.2rem);
      font-weight: 800;
    }

    .availability {
      margin-top: 18px;
      font-weight: bold;
      color: var(--success);
    }

    .lookup-form {
      display: flex;
      gap: 10px;
      max-width: 540px;
      margin: 26px auto 0;
    }

    input, button {
      min-height: 44px;
      border-radius: 8px;
      font-size: 1rem;
    }

    input {
      width: 100%;
      border: 1px solid #b8c4d1;
      padding: 10px 12px;
    }

    button {
      border: 0;
      background: var(--blue);
      color: white;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .error {
      color: #b42318;
      font-weight: bold;
    }

    .inventory-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .inventory-header h2 { margin: 0; }
    .inventory-search { width: min(100%, 380px); }
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      border-bottom: 1px solid var(--border);
      padding: 12px 10px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #edf3fa;
      color: var(--navy);
      position: sticky;
      top: 0;
    }

    td.price-cell {
      white-space: nowrap;
      font-weight: bold;
    }

    a { color: var(--blue); }

    .instructions {
      margin-top: 18px;
      padding: 14px;
      background: #f7f9fc;
      border-left: 4px solid var(--blue);
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      main {
        width: min(100% - 16px, 1100px);
        margin: 12px auto;
      }

      .panel { padding: 18px 14px; }
      .lookup-form { flex-direction: column; }
      button { width: 100%; }
    }

    @media print {
      body { background: white; }

      header,
      .lookup-form,
      .instructions,
      .inventory-search {
        display: none !important;
      }

      main {
        width: 100%;
        margin: 0;
      }

      .panel {
        box-shadow: none;
        border: 0;
        padding: 0;
      }

      tr {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      thead { display: table-header-group; }
      table { font-size: 10pt; }
      th, td { padding: 7px; }
    }
  </style>
</head>

<body>
  <header>
    <h1>34 Express Sports Cards</h1>
    <p>Scan or enter a card ID to view current card information.</p>
  </header>

  <main>
    <section id="detailView" class="panel card-detail hidden">
      <div id="detailContent"></div>

      <form id="lookupForm" class="lookup-form">
        <input
          id="lookupInput"
          type="text"
          placeholder="Enter card ID, for example CARD-0001"
          aria-label="Card ID"
        >
        <button type="submit">Look Up</button>
      </form>
    </section>

    <section id="inventoryView" class="panel hidden">
      <div class="inventory-header">
        <h2>Card Inventory</h2>
        <input
          id="inventorySearch"
          class="inventory-search"
          type="search"
          placeholder="Search ID, description, or price"
          aria-label="Search inventory"
        >
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Unique ID</th>
              <th>Card Description</th>
              <th>Price</th>
              <th>Card Link</th>
            </tr>
          </thead>
          <tbody id="inventoryBody"></tbody>
        </table>
      </div>

      <div class="instructions">
        <strong>QR code format:</strong>
        Use URLs such as
        <code>https://34esc.com/cards.html?id=CARD-0001</code>.
      </div>
    </section>
  </main>

    const detailView = document.getElementById("detailView");
    const inventoryView = document.getElementById("inventoryView");
    const detailContent = document.getElementById("detailContent");
    const inventoryBody = document.getElementById("inventoryBody");
    const inventorySearch = document.getElementById("inventorySearch");
    const lookupForm = document.getElementById("lookupForm");
    const lookupInput = document.getElementById("lookupInput");

    const cardMap = new Map(
      cards.map(card => [String(card.id).trim().toUpperCase(), card])
    );

    function formatPrice(price) {
      const number = Number(price);
      return Number.isFinite(number)
        ? number.toLocaleString("en-US", {
            style: "currency",
            currency: "USD"
          })
        : price;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeId(value) {
      return String(value || "").trim().toUpperCase();
    }

    function showCard(cardId) {
      detailView.classList.remove("hidden");
      inventoryView.classList.add("hidden");

      const normalizedId = normalizeId(cardId);
      const card = cardMap.get(normalizedId);

      if (!card) {
        detailContent.innerHTML = `
          <p class="error">Card ID ${escapeHtml(normalizedId)} was not found.</p>
          <p>Please check the ID and try again.</p>
        `;
        lookupInput.value = normalizedId;
        return;
      }

      document.title = `${card.description} | 34 Express Sports Cards`;

      detailContent.innerHTML = `
        <div class="card-id">Card ID: ${escapeHtml(card.id)}</div>
        <h2 class="card-description">${escapeHtml(card.description)}</h2>
        <div class="price-label">Current Price</div>
        <p class="price">${formatPrice(card.price)}</p>
        <p class="availability">Available</p>
      `;

      lookupInput.value = normalizedId;
    }

    function buildInventory(filteredCards = cards) {
      inventoryBody.innerHTML = filteredCards.map(card => {
        const cardUrl =
          `${window.location.origin}${window.location.pathname}?id=${encodeURIComponent(card.id)}`;

        return `
          <tr>
            <td>${escapeHtml(card.id)}</td>
            <td>${escapeHtml(card.description)}</td>
            <td class="price-cell">${formatPrice(card.price)}</td>
            <td><a href="${cardUrl}">View card</a></td>
          </tr>
        `;
      }).join("");
    }

    function showInventory() {
      detailView.classList.add("hidden");
      inventoryView.classList.remove("hidden");
      buildInventory();
    }

    lookupForm.addEventListener("submit", event => {
      event.preventDefault();
      const id = normalizeId(lookupInput.value);
      if (!id) return;

      const newUrl =
        `${window.location.pathname}?id=${encodeURIComponent(id)}`;

      window.history.pushState({}, "", newUrl);
      showCard(id);
    });

    inventorySearch.addEventListener("input", () => {
      const term = inventorySearch.value.trim().toLowerCase();

      const filtered = cards.filter(card =>
        card.id.toLowerCase().includes(term) ||
        card.description.toLowerCase().includes(term) ||
        String(card.price).toLowerCase().includes(term)
      );

      buildInventory(filtered);
    });

    window.addEventListener("popstate", () => {
      const id = new URLSearchParams(window.location.search).get("id");
      id ? showCard(id) : showInventory();
    });

    const requestedId = new URLSearchParams(window.location.search).get("id");
    requestedId ? showCard(requestedId) : showInventory();
  </script>
